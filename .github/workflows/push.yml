name: Kirby 64 Build CI

on:
  - push:
    branches: [ master, splat ]
  - workflow-dispatch:
    inputs: null


jobs:
  build:

    runs-on: [self-hosted, Linux, X64, Ubuntu]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Download Qemu Irix
      run: |
        wget https://github.com/n64decomp/qemu-irix/releases/download/v2.11-deb/qemu-irix-2.11.0-2169-g32ab296eef_amd64.deb
        sudo dpkg -i qemu-irix-2.11.0-2169-g32ab296eef_amd64.deb
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc git python3
        wget https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-amd64.deb
        sudo dpkg -i gcc-toolchain-mips64-amd64.deb
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
    - name: Get the dependency
      run: cp /etc/kirby64/* .
    - name: Prepare Kirby 64 for building
      run: make setup CROSS=/opt/libdragon/bin/mips64-elf-
    - name: Build Kirby 64
      run: make VERBOSE=1 CROSS=/opt/libdragon/bin/mips64-elf-
