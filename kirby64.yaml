  # ovl10 - ovl17 share ram
  - name: ovl10
    type: code
    overlay: yes
    symbol_name_format : $VRAM_ovl10
    start: 0x1CBF50
    vram: 0x801DB1E0
    exclusive_ram_id: self_contained
    bss_size: 0x80
    subsegments:
    - [0x1CBF50, c, ovl10/ovl10]
    - [0x1CC970, c, ovl10/ovl10_1]
    # func_801E2C78_ovl10 is byte-exact but is the LAST function in this
    # subsegment and its listing carries a 7-nop tail, so converting it
    # shortens ovl10_1's .text by 16. Standard padding recipe: the residue
    # is align32(end) - align16(end), which SUBALIGN(16) leaves behind.
    - [0x1D3AA0, pad]
    - [0x1D3AB0, c, ovl10/ovl10_2]
    - [0x1D44E0, c, ovl10/ovl10_3]
    # Hidden TU split, confirmed 2026-08-12. func_801EC3C8_ovl10's dead
    # epilogue is 32-byte aligned from its object's .text base, which only
    # holds if a TU starts here. Corroborated by the rodata partition: the last
    # ovl10_3_rd user is func_801EAB98_ovl10 (rom 0x1DB908), and the orphan
    # block at 0x1E58F0 has exactly two users, func_801EBC60_ovl10 (0x1DC9D0)
    # and func_801EBF2C_ovl10 (0x1DCC9C).
    - [0x1DC9D0, c, ovl10/ovl10_3b]
    - [0x1E0160, c, ovl10/ovl10_4]
    - [0x1E0500, c, ovl10/ovl10_5]
    # Hidden TU split, 2026-08-12. func_801F11A8_ovl10 and func_801F2098_ovl10
    # both end in an infinite loop and both have a dead epilogue whose `lw $ra`
    # sits at a rom offset == 16 mod 32 (0x1E21B0 and 0x1E3330). IDO emits a
    # literal `.align 5` after such a loop, so those epilogues are 32-byte
    # aligned from their object's .text base -- which cannot hold while the TU
    # starts at 0x1E0500 (== 0 mod 32). One split satisfies both.
    #
    # Only two function starts in range are == 16 mod 32: 0x1E0A50 and
    # 0x1E0D30. Unlike ovl10_3 the rodata does not discriminate -- ovl10_5_rd
    # is consumed strictly monotonically across the whole span, which either
    # split leaves consistent -- and there is no boundary zero-fill anywhere in
    # the segment. The call graph does discriminate: func_801EFF98_ovl10
    # (0x1E0D08) is called from 0x1E0720, 0x1E09C8 and 0x1E0C80 and from
    # nothing else in the ROM or in any data table. Those callers straddle
    # 0x1E0A50, so that split would make three intra-file calls cross a TU
    # boundary into a symbol with no external users; 0x1E0D30 puts all four in
    # the same TU, which is what a `static` helper looks like.
    #
    # The two candidates produce identical linked bytes and identical alignment
    # for the two affected functions, so the ROM gate cannot tell them apart.
    # Where they WOULD differ is a future rodata migration of ovl10_5: they
    # disagree about exactly D_801F4C58 and D_801F4C5C.
    - [0x1E0D30, c, ovl10/ovl10_5b]
    - [0x1E4160, data, ovl10/ovl10]
    - [0x1E5160, data, ovl10/ovl10_2]
    - [0x1E53E0, data, ovl10/ovl10_3]
    - [0x1E56F0, .rodata, ovl10/ovl10]
    - [0x1E5710, .rodata, ovl10/ovl10_1]
    - [0x1E57B0, .rodata, ovl10/ovl10_2]
    - [0x1E57F0, .rodata, ovl10/ovl10_3]
    # The old `1E58F0` orphan and `ovl10_4_rd` were one block belonging to
    # ovl10_3b: every symbol from 0x801F4B80 to 0x801F4C1C is referenced from
    # func_801EBC60..func_801EEB30, all inside ovl10_3b. ovl10_4's own rodata
    # is only 0x801F4C20..0x801F4C40 (func_801EF3F0), and ovl10_5's only
    # 0x801F4C40..0x801F4C60; the rest from 0x801F4C60 is ovl10_5b's.
    # 0x1E58F0..0x1E5900 stays an asm blob: it is 8 bytes of live data
    # (D_801F4B80/D_801F4B84, used by func_801EBC60 and func_801EBF2C) followed
    # by 8 ZERO bytes, i.e. SUBALIGN(16) padding at an OBJECT boundary. There
    # is a hidden TU split inside ovl10_3b between func_801EBF2C (0x1DCC9C) and
    # func_801EC6D8 (0x1DD448); until the C file is split to match, one object
    # cannot emit a 16-aligned hole in the middle of its own .rodata.
    - [0x1E58F0, rodata, ovl10/1E58F0]
    - [0x1E5900, .rodata, ovl10/ovl10_3b]
    - [0x1E5990, .rodata, ovl10/ovl10_4]
    - [0x1E59B0, .rodata, ovl10/ovl10_5]
    - [0x1E59D0, .rodata, ovl10/ovl10_5b]
    - [0x1E5AA0]
    - {type: bss, vram: 0x801f4d30, name: ovl10/ovl10}

