    - [0x1DFD0, c, main/interpolation]
    - [0x1EF90, pad]
    - [0x1EFA0, c, main/audio]
    - [0x21b20, pad]
    - [0x21B40, c, main/fault]
    - [0x23EB0, lib, libn_audio, n_cspsetpriority]
    - [0x23F00, lib, libn_audio, n_cspsetfxmix]
    # Same story as libn_audio_2 below: n_alSynAddPlayer ends at 0x2B670 and
    # n_alSynStopVoice at 0x2B6E0, each on a 16-byte boundary with nop fill --
    # separate libn_audio.a objects. One `c` subsegment per object; the rodata
    # all belongs to functions before 0x8002AA70, so it stays with libn_audio.
    - [0x23F60, c, main/libn_audio]
    - [0x2B670, c, main/libn_audio_b]
    - [0x2B6E0, c, main/libn_audio_c]
    - [0x2B910, lib, libn_audio, n_synsetpan]
    # 0x2B990..0x2DE50 is a run of n_audio library objects. From alCSPSetSeq on,
    # every function starts 16-byte aligned and the ROM has nop fill between
    # them: that fill is the LINKER aligning the next .o, so as one C file the
    # TU came out 40 bytes short and five matching drafts stayed guarded. One
    # `c` subsegment per object makes SUBALIGN(16) emit the fill and they are
    # all plain C now. No `pad` entry is needed -- each residue is exactly the
    # 16-byte alignment.
    - [0x2B990, c, main/libn_audio_2]
    - [0x2D9A0, c, main/libn_audio_2b]
    - [0x2DA20, c, main/libn_audio_2c]
