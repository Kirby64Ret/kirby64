name: Kirby 64 (US)
sha1: 6cea2d46b929a3bb347b060a77fccc83526fb855
options:
  basename: kirby
  target_path: baserom.us.z64
  find_file_boundaries: True
  platform: n64
  compiler: ido
  asm_emit_size_directive: True
  asm_path: asm
  src_path: src
  asset_path: assets
  base_path: .
  build_path: build
  lib_path: build
  o_as_suffix: True
  do_c_func_detection: True
  symbol_addrs_path: tools/symbol_addrs.txt
  extensions_path: tools/splat_ext
  # make_full_disasm_for_code: True
  # reloc_addrs_path: reloc_addrs.txt
  ld_script_path: kirby.ld
  asm_inc_header: ""
  use_legacy_include_asm: False
  subalign: 16
  segment_end_before_align: True
segments:
  - [0x0, header]

  - name: boot
    type: bin
    start: 0x0040

  - name: main
    type: code
    start: 0x1000
    end: 0x69EE0
    vram: 0x80000400
    bss_size: 0x589b0
    subsegments:
    - [0x1000, hasm, entry]
    - [0x1060, c, main/main]
    - [0x1500, c, main/sched]
    - [0x37A0, c, main/dma]
    - [0x49B0, pad]
